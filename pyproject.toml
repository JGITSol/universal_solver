[tool.black]
line-length = 88
target-version = ['py311']

[tool.isort]
profile = "black"
known_first_party = ["adv_resolver_math", "clean_code"]
known_third_party = ["kan"]
skip = [
	"adv_res_venv",
	"adv_resolver_math/adv_res_venv",
	"KAN/venv",
	"KAN",
	"build",
	"htmlcov",
	"universal_solver.egg-info",
	"adv_resolver_math/adv_resolver_math.egg-info",
]
skip_glob = ["**/__pycache__"]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
extend-exclude = [
	"adv_res_venv",
	"adv_resolver_math/adv_res_venv",
	"KAN/venv",
	"build",
	"htmlcov",
	"__pycache__",
	"*.egg-info",
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
explicit_package_bases = true
exclude = [
	"adv_res_venv",
	"adv_resolver_math/adv_res_venv",
	"build",
	"KAN/venv",
]
